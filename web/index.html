<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Ajedrez</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- Game controls — always on top, outside Bevy canvas focus -->
  <div id="game-controls">
    <button class="game-btn" id="btn-pause" onclick="togglePause()">⏸ Pausa</button>
    <button class="game-btn" id="btn-exit" onclick="exitGame()">✕ Nueva partida</button>
  </div>

  <!-- Loading overlay — shown until Bevy renders first frame -->
  <div id="loading-overlay">
    <div class="loading-box">
      <div class="loading-title">♟ AJEDREZ</div>
      <div class="loading-hint">Cargando...</div>
    </div>
  </div>

  <!-- Pause overlay -->
  <div id="pause-overlay">
    <div class="pause-box">
      <div class="pause-title">⏸ PAUSA</div>
      <button class="pause-resume-btn" onclick="togglePause()">▶ Reanudar</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
