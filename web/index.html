<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Ajedrez</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- Loading overlay — shown until Bevy renders first frame -->
  <div id="loading-overlay">
    <div class="loading-box">
      <div class="loading-title">♟ AJEDREZ</div>
      <div class="loading-hint">Cargando...</div>
    </div>
  </div>

  <!-- Pause overlay -->
  <div id="pause-overlay">
    <div class="pause-box">
      <div class="pause-title">⏸ PAUSA</div>
      <button class="pause-resume-btn" onclick="togglePause()">▶ Reanudar</button>
      <button id="pause-hub-btn" class="pause-nav-btn pause-hub" onclick="pauseGoToHub()" style="display:none">🎓 Menú Learning</button>
      <button class="pause-nav-btn pause-home" onclick="pauseGoToHome()">🏠 Menú Principal</button>
    </div>
  </div>

  <!-- Keyboard hint (desktop) / Menu button (touch) — shown only during Playing state -->
  <div id="esc-hint">Tecla 'Esc' para abrir el menú</div>
  <button id="menu-btn" onclick="togglePause()">☰ Menú</button>

  <!-- Feedback modal — pure HTML so the mobile keyboard can open -->
  <div id="feedback-modal">
    <div class="feedback-box">
      <div class="feedback-title">Reportar problema / Sugerencia</div>
      <label class="feedback-label" for="feedback-textarea">Escribí tu mensaje:</label>
      <textarea id="feedback-textarea" maxlength="2000" rows="5" placeholder="Escribí aquí..."></textarea>
      <div class="feedback-btn-row">
        <button class="feedback-btn feedback-btn-cancel" onclick="window.closeFeedbackModal()">Cancelar</button>
        <button class="feedback-btn feedback-btn-send"   onclick="window.sendFeedback()">Enviar</button>
      </div>
      <div id="feedback-status"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
