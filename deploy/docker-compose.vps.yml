services:
  rust-chess:
    image: rust-chess:latest
    container_name: rust-chess
    ports:
      - "127.0.0.1:8007:80"
    mem_limit: 32m
    restart: unless-stopped

  chess-api:
    image: chess-api:latest
    container_name: chess-api
    ports:
      - "127.0.0.1:8005:8005"
    mem_limit: 128m
    restart: unless-stopped
    env_file: /opt/rust-chess/.env
    depends_on:
      chess-db:
        condition: service_healthy

  chess-db:
    image: postgres:16-alpine
    container_name: chess-db
    volumes:
      - chess-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB:       chess
      POSTGRES_USER:     chess
      POSTGRES_PASSWORD: chess_pass
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  chess-db-data:
