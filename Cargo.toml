[workspace]
members = [".", "chess-engine", "chess-server"]
resolver = "2"

[package]
name = "bevy_chess"
version = "0.1.0"
authors = ["mgrinberg <maticgrinberg@gmail.com>"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = "0.14"
bevy_mod_picking = { version = "0.20", default-features = false, features = ["backend_raycast", "selection"] }
chess-engine = { path = "chess-engine" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
getrandom = { version = "0.3", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["Window", "Location", "Storage"] }
gloo-net = { version = "0.6", features = ["http", "json"] }
serde = { version = "1", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
