[package]
name = "bevy_chess"
version = "0.1.0"
authors = ["mgrinberg <maticgrinberg@gmail.com>"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = "0.14"
bevy_mod_picking = { version = "0.20", default-features = false, features = ["backend_raycast", "selection"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
