name: Deploy to VPS

on:
  push:
    branches: [browser]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build rust-chess WASM image and deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build rust-chess image
        run: |
          docker buildx build --load \
            -f deploy/Dockerfile.vps \
            -t rust-chess:latest .

      - name: Save image as tarball
        run: docker save rust-chess:latest | gzip > rust-chess.tar.gz

      - name: Copy image and compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: mgrinberg
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "rust-chess.tar.gz,deploy/docker-compose.vps.yml"
          target: /tmp/

      - name: Load image and restart on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: mgrinberg
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker load < /tmp/rust-chess.tar.gz
            rm /tmp/rust-chess.tar.gz
            cp /tmp/deploy/docker-compose.vps.yml /opt/rust-chess/docker-compose.vps.yml
            rm -rf /tmp/deploy
            cd /opt/rust-chess
            docker compose -f docker-compose.vps.yml up -d --force-recreate
            docker compose -f docker-compose.vps.yml ps
